<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="py-4">
        <div class="container">

            <h3 class="fw-bold mb-4"><i class="bi bi-heart-fill text-danger me-2"></i>My Wishlist (<span th:text="${#lists.size(wishlistProducts)}">2</span> items)</h3>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(wishlistProducts)}" class="card border-0 shadow-sm rounded-3 text-center py-5">
                <div class="card-body">
                    <i class="bi bi-heartbreak text-muted display-1 mb-3"></i>
                    <h4 class="fw-bold">Your Wishlist is Empty</h4>
                    <p class="text-muted mb-4">Explore our catalogue and save your favourite items here for quick checkout later.</p>
                    <a th:href="@{/products}" class="btn btn-primary btn-lg rounded-pill px-5 fw-semibold shadow-sm">
                        <i class="bi bi-bag-plus me-1"></i> Explore Products
                    </a>
                </div>
            </div>

            <!-- Wishlist Products Grid -->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${!#lists.isEmpty(wishlistProducts)}">
                <div class="col" th:each="prod : ${wishlistProducts}">
                    <div class="product-card shadow-sm h-100">
                        <div class="product-image-wrap">
                            <span class="discount-badge" th:if="${prod.discountPercentage > 0}"
                                  th:text="${#numbers.formatDecimal(prod.discountPercentage, 0, 0)} + '% OFF'">15% OFF</span>
                            <form th:action="@{/wishlist/remove/{id}(id=${prod.id})}" method="POST" class="position-absolute top-0 end-0 p-2">
                                <button type="submit" class="btn btn-light btn-sm rounded-circle shadow-sm" title="Remove from wishlist">
                                    <i class="bi bi-x-lg text-danger"></i>
                                </button>
                            </form>
                            <a th:href="@{/products/{slug}(slug=${prod.slug})}">
                                <img th:src="${prod.imageUrl != null ? prod.imageUrl : '/images/products/placeholder.svg'}"
                                     th:alt="${prod.name}"
                                     onerror="this.onerror=null; this.src='/images/products/placeholder.svg';"
                                     loading="lazy">
                            </a>
                        </div>
                        <div class="product-body">
                            <div class="product-brand" th:text="${prod.brand}">Brand</div>
                            <a th:href="@{/products/{slug}(slug=${prod.slug})}" class="product-title" th:text="${prod.name}">Product Name</a>
                            
                            <div class="d-flex align-items-center mb-2">
                                <span class="rating-badge"><i class="bi bi-star-fill"></i> <span th:text="${prod.rating}">4.5</span></span>
                                <span class="rating-count" th:text="'(' + ${prod.reviewCount} + ')'">(120)</span>
                            </div>

                            <div class="price-box">
                                <div class="d-flex align-items-baseline">
                                    <span class="current-price" th:text="'₹' + ${#numbers.formatDecimal(prod.getDiscountedPrice(), 0, 'COMMA', 0, 'POINT')}">₹49,999</span>
                                    <span class="original-price" th:if="${prod.discountPercentage > 0}"
                                          th:text="'₹' + ${#numbers.formatDecimal(prod.price, 0, 'COMMA', 0, 'POINT')}">₹59,999</span>
                                </div>
                                <div class="small text-success mt-1 fw-semibold" th:if="${!prod.isOutOfStock()}">
                                    <i class="bi bi-check-circle-fill"></i> In Stock
                                </div>
                                <div class="small text-danger mt-1 fw-semibold" th:if="${prod.isOutOfStock()}">
                                    <i class="bi bi-x-circle-fill"></i> Out of Stock
                                </div>

                                <form th:action="@{/wishlist/move-to-cart/{id}(id=${prod.id})}" method="POST" class="mt-3">
                                    <button type="submit" class="btn btn-primary w-100 btn-sm fw-bold rounded-pill"
                                            th:disabled="${prod.isOutOfStock()}">
                                        <i class="bi bi-bag-check-fill me-1"></i> Move to Cart
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
