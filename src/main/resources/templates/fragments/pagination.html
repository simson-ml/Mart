<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(pageObj, baseUrl)" th:if="${pageObj.totalPages > 1}" class="d-flex justify-content-center mt-4">
    <nav aria-label="Page navigation">
        <ul class="pagination shadow-sm">
            <!-- First Page -->
            <li class="page-item" th:classappend="${pageObj.first} ? 'disabled'">
                <a class="page-link" th:href="@{${baseUrl}(page=0)}">&laquo;&laquo;</a>
            </li>
            <!-- Previous Page -->
            <li class="page-item" th:classappend="${pageObj.first} ? 'disabled'">
                <a class="page-link" th:href="@{${baseUrl}(page=${pageObj.number - 1})}">&laquo;</a>
            </li>
            <!-- Page numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, pageObj.totalPages - 1)}"
                th:if="${i >= pageObj.number - 2 and i <= pageObj.number + 2}"
                th:classappend="${i == pageObj.number} ? 'active'">
                <a class="page-link" th:href="@{${baseUrl}(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <!-- Next Page -->
            <li class="page-item" th:classappend="${pageObj.last} ? 'disabled'">
                <a class="page-link" th:href="@{${baseUrl}(page=${pageObj.number + 1})}">&raquo;</a>
            </li>
            <!-- Last Page -->
            <li class="page-item" th:classappend="${pageObj.last} ? 'disabled'">
                <a class="page-link" th:href="@{${baseUrl}(page=${pageObj.totalPages - 1})}">&raquo;&raquo;</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
