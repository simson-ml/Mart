<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container" style="max-width: 460px;">

            <div class="card border-0 shadow rounded-4 p-4 p-sm-5 bg-white">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-primary display-4 mb-2"></i>
                    <h5 class="fw-bold text-dark">Set New Password</h5>
                    <p class="text-muted small">Please enter your new secure password below.</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/reset-password}" method="POST">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required autofocus>
                            <button type="button" class="btn btn-outline-secondary toggle-password-btn" data-target="password" title="Show or hide password" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold small">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter password" minlength="6" required>
                            <button type="button" class="btn btn-outline-secondary toggle-password-btn" data-target="confirmPassword" title="Show or hide password" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                        Update Password
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
