<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ShopSphere Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container" style="max-width: 460px;">

            <div class="card border-0 shadow rounded-4 p-4 p-sm-5 bg-white">
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="brand-title fs-2 d-inline-block mb-1">SHOPSPHERE</a>
                    <p class="text-muted small">Sign in to manage your orders, cart, and profile</p>
                </div>

                <form th:action="@{/login}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <a th:href="@{/forgot-password}" class="small text-decoration-none">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                        <label class="form-check-label small" for="remember-me">Remember me on this browser</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <!-- Demo Viva Presentation Helper Buttons -->
                <div class="bg-light p-3 rounded-3 mt-2 border">
                    <div class="small fw-bold text-muted text-uppercase mb-2 text-center">
                        <i class="bi bi-laptop me-1"></i> Quick-Fill Demo Credentials (Viva)
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" id="fill-admin-btn" class="btn btn-outline-warning btn-sm w-50 text-dark fw-bold">
                            <i class="bi bi-shield-lock me-1"></i> Admin Login
                        </button>
                        <button type="button" id="fill-user-btn" class="btn btn-outline-primary btn-sm w-50 fw-bold">
                            <i class="bi bi-person me-1"></i> Customer Login
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">
                        Don't have an account yet?
                        <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Create an Account</a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
