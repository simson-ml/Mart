<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container" style="max-width: 520px;">

            <div class="card border-0 shadow rounded-4 p-4 p-sm-5 bg-white">
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="brand-title fs-2 d-inline-block mb-1">SHOPSPHERE</a>
                    <h5 class="fw-bold text-dark">Create Your Account</h5>
                    <p class="text-muted small">Sign up to enjoy express checkout, wishlist, and discounts</p>
                </div>

                <form th:action="@{/register}" th:object="${registerRequest}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="+91 9876543210">
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Password * (Min 6 chars)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Confirm Password *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm password error</div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                        <i class="bi bi-person-check-fill me-1"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="small text-muted mb-0">
                        Already have an account?
                        <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Sign In</a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
