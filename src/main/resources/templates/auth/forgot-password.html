<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container" style="max-width: 460px;">

            <div class="card border-0 shadow rounded-4 p-4 p-sm-5 bg-white">
                <div class="text-center mb-4">
                    <i class="bi bi-key-fill text-warning display-4 mb-2"></i>
                    <h5 class="fw-bold text-dark">Forgot Password?</h5>
                    <p class="text-muted small">Enter your registered email address and we'll simulate sending you a password reset link.</p>
                </div>

                <form th:action="@{/forgot-password}" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold small">Registered Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                        Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
