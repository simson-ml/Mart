<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="py-4">
        <div class="container">

            <h3 class="fw-bold mb-4"><i class="bi bi-person-badge text-primary me-2"></i>Account Settings</h3>

            <div class="row g-4">
                <!-- Left: Account Navigation Sidebar -->
                <div class="col-lg-3">
                    <div class="card border-0 shadow-sm rounded-3 p-3">
                        <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-3">
                            <i class="bi bi-person-circle fs-1 text-primary"></i>
                            <div class="text-truncate">
                                <h6 class="fw-bold text-dark mb-0" th:text="${user.name}">User Name</h6>
                                <small class="text-muted" th:text="${user.email}">user@example.com</small>
                            </div>
                        </div>

                        <nav class="nav flex-column gap-1">
                            <a class="nav-link active fw-semibold text-primary py-2 px-3 rounded bg-light" th:href="@{/account/profile}">
                                <i class="bi bi-person me-2"></i> Personal Profile
                            </a>
                            <a class="nav-link text-dark py-2 px-3 rounded" th:href="@{/orders}">
                                <i class="bi bi-box-seam me-2"></i> Order History
                            </a>
                            <a class="nav-link text-dark py-2 px-3 rounded" th:href="@{/account/addresses}">
                                <i class="bi bi-geo-alt me-2"></i> Saved Addresses
                            </a>
                            <a class="nav-link text-dark py-2 px-3 rounded" th:href="@{/wishlist}">
                                <i class="bi bi-heart me-2"></i> My Wishlist
                            </a>
                        </nav>
                    </div>
                </div>

                <!-- Right: Profile Form & Password Change Form -->
                <div class="col-lg-9">
                    <!-- Update Profile Card -->
                    <div class="card border-0 shadow-sm rounded-3 p-4 mb-4">
                        <h5 class="fw-bold border-bottom pb-3 mb-3">Personal Information</h5>
                        
                        <form th:action="@{/account/profile/update}" th:object="${profileRequest}" method="POST">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name *</label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Phone Number</label>
                                    <input type="text" th:field="*{phone}" class="form-control" placeholder="+91 9876543210">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-muted">Email Address (Immutable)</label>
                                    <input type="email" class="form-control bg-light" th:value="${user.email}" readonly disabled>
                                    <small class="text-muted">Email address is tied to your account identity.</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-muted">Role</label>
                                    <input type="text" class="form-control bg-light text-uppercase font-monospace" th:value="${user.role}" readonly disabled>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                                        Save Changes
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Change Password Card -->
                    <div class="card border-0 shadow-sm rounded-3 p-4">
                        <h5 class="fw-bold border-bottom pb-3 mb-3">Security & Password</h5>

                        <form th:action="@{/account/password/change}" th:object="${passwordRequest}" method="POST">
                            <div class="row g-3" style="max-width: 500px;">
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Current Password *</label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{currentPassword}" class="form-control" required>
                                        <button type="button" class="btn btn-outline-secondary toggle-password-btn" title="Show or hide password" aria-label="Toggle password visibility">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">Error</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">New Password *</label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{newPassword}" class="form-control" required>
                                        <button type="button" class="btn btn-outline-secondary toggle-password-btn" title="Show or hide password" aria-label="Toggle password visibility">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Error</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Confirm New Password *</label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{confirmPassword}" class="form-control" required>
                                        <button type="button" class="btn btn-outline-secondary toggle-password-btn" title="Show or hide password" aria-label="Toggle password visibility">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Error</div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-outline-primary rounded-pill px-4 fw-bold">
                                        Update Password
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
