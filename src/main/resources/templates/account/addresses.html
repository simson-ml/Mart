<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Addresses — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="py-4">
        <div class="container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0"><i class="bi bi-geo-alt-fill text-success me-2"></i>My Addresses</h3>
                <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                    <i class="bi bi-plus-lg me-1"></i> Add New Address
                </button>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(addresses)}" class="card border-0 shadow-sm rounded-3 text-center py-5">
                <div class="card-body">
                    <i class="bi bi-geo text-muted display-1 mb-3"></i>
                    <h4 class="fw-bold">No Addresses Saved</h4>
                    <p class="text-muted mb-4">Add your shipping addresses to speed up checkout.</p>
                    <button type="button" class="btn btn-primary btn-lg rounded-pill px-5 fw-semibold shadow-sm" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                        Add an Address
                    </button>
                </div>
            </div>

            <!-- Addresses Grid -->
            <div class="row row-cols-1 row-cols-md-2 g-4" th:if="${!#lists.isEmpty(addresses)}">
                <div class="col" th:each="addr : ${addresses}">
                    <div class="card border-0 shadow-sm rounded-3 p-4 h-100 position-relative"
                         th:classappend="${addr.default} ? 'border-start border-success border-4' : ''">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h5 class="fw-bold text-dark mb-0" th:text="${addr.fullName}">Full Name</h5>
                                <span class="badge bg-secondary text-uppercase mt-1" th:text="${addr.addressType}">HOME</span>
                                <span class="badge bg-success mt-1" th:if="${addr.default}">DEFAULT</span>
                            </div>
                            <div class="dropdown">
                                <button class="btn btn-light btn-sm rounded-circle" type="button" data-bs-toggle="dropdown">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                                    <li th:if="${!addr.default}">
                                        <form th:action="@{/account/addresses/default/{id}(id=${addr.id})}" method="POST">
                                            <button type="submit" class="dropdown-item py-2 text-success">
                                                <i class="bi bi-check2-circle me-2"></i> Set as Default
                                            </button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/account/addresses/delete/{id}(id=${addr.id})}" method="POST"
                                              onsubmit="return confirm('Are you sure you want to delete this address?');">
                                            <button type="submit" class="dropdown-item py-2 text-danger">
                                                <i class="bi bi-trash3 me-2"></i> Delete
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <p class="text-secondary small mb-2" style="line-height: 1.6;" th:text="${addr.formattedAddress}">
                            Address details line...
                        </p>
                        <div class="text-muted small mt-auto pt-2 border-top">
                            <i class="bi bi-telephone-fill me-1"></i> Phone: <strong th:text="${addr.phone}">+91 9876543210</strong>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Add Address Modal -->
    <div class="modal fade" id="addAddressModal" tabindex="-1" aria-labelledby="addAddressModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-3 border-0 shadow">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold" id="addAddressModalLabel">Add New Address</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/account/addresses/add}" th:object="${addressDto}" method="POST">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Full Name *</label>
                                <input type="text" th:field="*{fullName}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Phone Number *</label>
                                <input type="text" th:field="*{phone}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">Address Line 1 *</label>
                                <input type="text" th:field="*{addressLine1}" class="form-control form-control-sm" placeholder="Flat, Building, Street" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">Address Line 2</label>
                                <input type="text" th:field="*{addressLine2}" class="form-control form-control-sm" placeholder="Landmark, Area">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">City *</label>
                                <input type="text" th:field="*{city}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">State *</label>
                                <input type="text" th:field="*{state}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Pincode *</label>
                                <input type="text" th:field="*{pincode}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Address Type</label>
                                <select th:field="*{addressType}" class="form-select form-select-sm">
                                    <option value="HOME">HOME</option>
                                    <option value="WORK">WORK</option>
                                    <option value="OTHER">OTHER</option>
                                </select>
                            </div>
                            <div class="col-md-6 d-flex align-items-center mt-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{default}" id="setDefaultCheck">
                                    <label class="form-check-label small" for="setDefaultCheck">Set as default</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top">
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill px-4 fw-bold">Save Address</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
