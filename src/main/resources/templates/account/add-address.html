<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Address — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="py-4">
        <div class="container">

            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/account/profile}" class="text-decoration-none">My Account</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/account/addresses}" class="text-decoration-none">Saved Addresses</a></li>
                    <li class="breadcrumb-item active" th:text="${editMode != null and editMode ? 'Edit Address' : 'Add New Address'}">Add New Address</li>
                </ol>
            </nav>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                        <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
                            <div>
                                <h4 class="fw-bold text-dark mb-1">
                                    <i class="bi bi-geo-alt-fill text-primary me-2"></i><span th:text="${editMode != null and editMode ? 'Edit Delivery Address' : 'Add New Delivery Address'}">Add New Delivery Address</span>
                                </h4>
                                <p class="text-muted small mb-0">Fill in your complete shipping details below</p>
                            </div>
                            <a th:href="@{/account/addresses}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                                <i class="bi bi-arrow-left me-1"></i> Back to Addresses
                            </a>
                        </div>

                        <form th:action="${editMode != null and editMode ? '/account/addresses/edit/' + addressId : '/account/addresses/add'}" th:object="${addressDto}" method="POST">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Full Name *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full name error</div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Phone Number *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                        <input type="text" th:field="*{phone}" class="form-control" placeholder="10-digit mobile number" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Address Line 1 (Flat, House no., Building, Street) *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-building"></i></span>
                                        <input type="text" th:field="*{addressLine1}" class="form-control" placeholder="Flat 402, Green Acres Residency, MG Road" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('addressLine1')}" th:errors="*{addressLine1}">Address Line 1 error</div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Address Line 2 (Area, Colony, Landmark)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-geo"></i></span>
                                        <input type="text" th:field="*{addressLine2}" class="form-control" placeholder="Near City Center Mall, Sector 14">
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('addressLine2')}" th:errors="*{addressLine2}">Address Line 2 error</div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">City / Town *</label>
                                    <input type="text" th:field="*{city}" class="form-control" placeholder="e.g. Bengaluru" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">City error</div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">State *</label>
                                    <input type="text" th:field="*{state}" class="form-control" placeholder="e.g. Karnataka" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('state')}" th:errors="*{state}">State error</div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Pincode (6 digits) *</label>
                                    <input type="text" th:field="*{pincode}" class="form-control" placeholder="e.g. 560001" maxlength="6" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('pincode')}" th:errors="*{pincode}">Pincode error</div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Address Type</label>
                                    <select th:field="*{addressType}" class="form-select">
                                        <option value="HOME">HOME (All day delivery)</option>
                                        <option value="WORK">WORK (Delivery between 9 AM - 6 PM)</option>
                                        <option value="OTHER">OTHER</option>
                                    </select>
                                </div>

                                <div class="col-md-6 d-flex align-items-center mt-md-4 pt-md-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{default}" id="setDefaultCheck">
                                        <label class="form-check-label fw-semibold small" for="setDefaultCheck">
                                            Make this my default delivery address
                                        </label>
                                    </div>
                                </div>

                                <div class="col-12 mt-4 pt-3 border-top d-flex gap-3">
                                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm">
                                        <i class="bi bi-check-lg me-1"></i> Save Address
                                    </button>
                                    <a th:href="@{/account/addresses}" class="btn btn-outline-secondary btn-lg rounded-pill px-4 fw-semibold">
                                        Cancel
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
