<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management — Admin ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-lg-2 col-md-3">
                <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('categories')}"></div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-10 col-md-9 p-4">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Category Management</h3>
                        <small class="text-muted">Organize your store departments and catalog hierarchy</small>
                    </div>
                    <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#createCategoryModal">
                        <i class="bi bi-plus-lg me-1"></i> Add New Category
                    </button>
                </div>

                <!-- Categories Table -->
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light small text-muted text-uppercase">
                                <tr>
                                    <th>ID</th>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Slug</th>
                                    <th>Products Count</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td class="font-monospace text-muted" th:text="${cat.id}">1</td>
                                    <td>
                                        <img th:src="${cat.imageUrl != null ? cat.imageUrl : '/images/categories/default.svg'}"
                                             th:alt="${cat.name}"
                                             onerror="this.onerror=null; this.src='/images/categories/default.svg';"
                                             class="rounded bg-light p-1" style="width: 45px; height: 45px; object-fit: contain;">
                                    </td>
                                    <td class="fw-bold text-dark" th:text="${cat.name}">Category Name</td>
                                    <td class="font-monospace text-muted small" th:text="${cat.slug}">category-slug</td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${#lists.size(cat.products)} + ' products'">10 products</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${cat.active} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${cat.active ? 'Active' : 'Disabled'}">Active</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                                                    th:attr="data-bs-target='#editCategoryModal-' + ${cat.id}">
                                                <i class="bi bi-pencil-fill"></i> Edit
                                            </button>
                                            <form th:action="@{/admin/categories/toggle/{id}(id=${cat.id})}" method="POST" class="d-inline">
                                                <button type="submit" class="btn btn-outline-secondary" th:title="${cat.active ? 'Disable' : 'Enable'}">
                                                    <i class="bi" th:classappend="${cat.active ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                                </button>
                                            </form>
                                        </div>

                                        <!-- Edit Modal for this category -->
                                        <div class="modal fade text-start" th:id="'editCategoryModal-' + ${cat.id}" tabindex="-1" aria-hidden="true">
                                            <div class="modal-dialog modal-dialog-centered">
                                                <div class="modal-content border-0 shadow">
                                                    <div class="modal-header border-bottom">
                                                        <h5 class="modal-title fw-bold">Edit Category</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                    </div>
                                                    <form th:action="@{/admin/categories/update/{id}(id=${cat.id})}" method="POST" enctype="multipart/form-data">
                                                        <div class="modal-body">
                                                            <div class="mb-3">
                                                                <label class="form-label small fw-bold">Category Name *</label>
                                                                <input type="text" name="name" class="form-control" th:value="${cat.name}" required>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label small fw-bold">Description</label>
                                                                <textarea name="description" class="form-control" rows="2" th:text="${cat.description}"></textarea>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label small fw-bold">Image URL / Path</label>
                                                                <input type="text" name="imageUrl" class="form-control form-control-sm" th:value="${cat.imageUrl}">
                                                            </div>
                                                            <div class="form-check form-switch">
                                                                <input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${cat.active}" th:id="'catActive-' + ${cat.id}">
                                                                <label class="form-check-label small" th:for="'catActive-' + ${cat.id}">Active category</label>
                                                            </div>
                                                        </div>
                                                        <div class="modal-footer border-top">
                                                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                                                            <button type="submit" class="btn btn-primary btn-sm fw-bold">Save Changes</button>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>

                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Create Category Modal -->
    <div class="modal fade" id="createCategoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold">Create New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/categories/create}" th:object="${categoryDto}" method="POST" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Category Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Smart Wearables" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Brief category description..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Image URL / Path</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control form-control-sm" placeholder="e.g. /images/categories/accessories.svg">
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="newCatActive" checked>
                            <label class="form-check-label small" for="newCatActive">Active category</label>
                        </div>
                    </div>
                    <div class="modal-footer border-top">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm fw-bold">Create Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
