<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupon Promotions — Admin ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-lg-2 col-md-3">
                <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('coupons')}"></div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-10 col-md-9 p-4">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Discounts & Promo Coupons</h3>
                        <small class="text-muted">Create percentage or fixed price promo codes for promotional campaigns</small>
                    </div>
                    <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#createCouponModal">
                        <i class="bi bi-plus-lg me-1"></i> Create New Coupon
                    </button>
                </div>

                <!-- Coupons Table -->
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light small text-muted text-uppercase">
                                <tr>
                                    <th>Code</th>
                                    <th>Discount Type & Value</th>
                                    <th>Min Order Amount</th>
                                    <th>Max Discount</th>
                                    <th>Usage / Limit</th>
                                    <th>Valid Until</th>
                                    <th>Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cpn : ${couponsPage.content}">
                                    <td>
                                        <span class="badge bg-light text-primary border font-monospace fs-6 px-3 py-2" th:text="${cpn.code}">WELCOME10</span>
                                    </td>
                                    <td>
                                        <strong class="text-dark" th:if="${cpn.discountType.name() == 'PERCENTAGE'}" th:text="${cpn.discountValue} + '% OFF'">10% OFF</strong>
                                        <strong class="text-dark" th:if="${cpn.discountType.name() == 'FIXED_AMOUNT'}" th:text="'₹' + ${cpn.discountValue} + ' FLAT OFF'">₹500 OFF</strong>
                                    </td>
                                    <td th:text="'₹' + ${#numbers.formatDecimal(cpn.minimumOrderAmount, 0, 'COMMA', 0, 'POINT')}">₹500</td>
                                    <td>
                                        <span th:if="${cpn.maximumDiscount != null}" th:text="'₹' + ${#numbers.formatDecimal(cpn.maximumDiscount, 0, 'COMMA', 0, 'POINT')}">₹1,000</span>
                                        <span th:if="${cpn.maximumDiscount == null}" class="text-muted">No Cap</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary text-white" th:text="${cpn.usageCount} + ' / ' + ${cpn.usageLimit}">5 / 500</span>
                                    </td>
                                    <td class="small" th:text="${#temporals.format(cpn.expiryDate, 'dd MMM yyyy')}">31 Dec 2030</td>
                                    <td>
                                        <span class="badge" th:classappend="${cpn.isCurrentlyValid()} ? 'bg-success' : 'bg-danger'"
                                              th:text="${cpn.isCurrentlyValid() ? 'Active' : 'Expired/Inactive'}">Active</span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/coupons/toggle/{id}(id=${cpn.id})}" method="POST" class="d-inline">
                                            <button type="submit" class="btn btn-sm rounded-pill fw-semibold"
                                                    th:classappend="${cpn.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                    th:text="${cpn.active ? 'Deactivate' : 'Activate'}">
                                                Toggle
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:replace="~{fragments/pagination :: pagination(${couponsPage}, '/admin/coupons')}"></div>

            </div>
        </div>
    </div>

    <!-- Create Coupon Modal -->
    <div class="modal fade" id="createCouponModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold">Create New Promotion Coupon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/coupons/create}" th:object="${couponDto}" method="POST">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Coupon Code *</label>
                                <input type="text" th:field="*{code}" class="form-control text-uppercase font-monospace" placeholder="e.g. SUMMER30" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Discount Type *</label>
                                <select th:field="*{discountType}" class="form-select">
                                    <option th:each="dt : ${discountTypes}" th:value="${dt}" th:text="${dt}">PERCENTAGE</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Discount Value * (% or ₹)</label>
                                <input type="number" step="0.01" th:field="*{discountValue}" class="form-control" placeholder="e.g. 15.00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Min Order Amount (₹)</label>
                                <input type="number" step="0.01" th:field="*{minimumOrderAmount}" class="form-control" placeholder="e.g. 1000.00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Max Discount Cap (₹)</label>
                                <input type="number" step="0.01" th:field="*{maximumDiscount}" class="form-control" placeholder="e.g. 1500.00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Usage Limit (Count)</label>
                                <input type="number" th:field="*{usageLimit}" class="form-control" value="100" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Start Date *</label>
                                <input type="datetime-local" th:field="*{startDate}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Expiry Date *</label>
                                <input type="datetime-local" th:field="*{expiryDate}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}" id="newCouponActive" checked>
                                    <label class="form-check-label small" for="newCouponActive">Active and immediately redeemable</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top">
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill px-4 fw-bold">Create Coupon</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
