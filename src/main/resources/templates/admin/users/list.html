<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users & Customers — Admin ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-lg-2 col-md-3">
                <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('users')}"></div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-10 col-md-9 p-4">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Registered Users & Customers</h3>
                        <small class="text-muted">Supervise customer accounts and enforce security state</small>
                    </div>
                </div>

                <!-- Search Users Form -->
                <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
                    <form th:action="@{/admin/users}" method="GET" class="row g-3 align-items-center">
                        <div class="col-md-9">
                            <input type="text" name="keyword" class="form-control form-control-sm" placeholder="Search by user name, email, or phone number..." th:value="${keyword}">
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm rounded-pill w-100 fw-semibold">
                                <i class="bi bi-search me-1"></i> Search Users
                            </button>
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm rounded-pill">Reset</a>
                        </div>
                    </form>
                </div>

                <!-- Users Table -->
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light small text-muted text-uppercase">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email Address</th>
                                    <th>Phone</th>
                                    <th>Role</th>
                                    <th>Account Status</th>
                                    <th>Joined Date</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${usersPage.content}">
                                    <td class="font-monospace text-muted" th:text="${u.id}">1</td>
                                    <td>
                                        <strong class="text-dark" th:text="${u.name}">User Name</strong>
                                    </td>
                                    <td th:text="${u.email}">user@example.com</td>
                                    <td class="text-muted small" th:text="${u.phone != null ? u.phone : '—'}">+91 9876543210</td>
                                    <td>
                                        <span class="badge" th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                                              th:text="${u.role}">USER</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${u.enabled} ? 'bg-success' : 'bg-danger'"
                                              th:text="${u.enabled ? 'Active' : 'Suspended'}">Active</span>
                                    </td>
                                    <td class="small" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">07 Oct 2026</td>
                                    <td class="text-end">
                                        <form th:if="${!u.isAdmin()}" th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="POST" class="d-inline">
                                            <button type="submit" class="btn btn-sm rounded-pill fw-semibold"
                                                    th:classappend="${u.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                    th:text="${u.enabled ? 'Suspend' : 'Activate'}">
                                                Toggle
                                            </button>
                                        </form>
                                        <span th:if="${u.isAdmin()}" class="badge bg-light text-muted border">System Admin</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:replace="~{fragments/pagination :: pagination(${usersPage}, '/admin/users')}"></div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
