<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management — Admin ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-lg-2 col-md-3">
                <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('orders')}"></div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-10 col-md-9 p-4">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Customer Orders Management</h3>
                        <small class="text-muted">Review, process, dispatch, and track customer shipments</small>
                    </div>
                </div>

                <!-- Filters & Search Form -->
                <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
                    <form th:action="@{/admin/orders}" method="GET" class="row g-3 align-items-center">
                        <div class="col-md-6">
                            <input type="text" name="keyword" class="form-control form-control-sm" placeholder="Search by Order #, Customer Name, or Email..." th:value="${keyword}">
                        </div>
                        <div class="col-md-4">
                            <select name="status" class="form-select form-select-sm" onchange="this.form.submit();">
                                <option value="">All Order Statuses</option>
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}"
                                        th:selected="${selectedStatus == st}">Status</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm rounded-pill w-100 fw-semibold">
                                <i class="bi bi-search me-1"></i> Search
                            </button>
                            <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm rounded-pill">Reset</a>
                        </div>
                    </form>
                </div>

                <!-- Orders Table -->
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light small text-muted text-uppercase">
                                <tr>
                                    <th>Order #</th>
                                    <th>Customer</th>
                                    <th>Items</th>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Payment</th>
                                    <th>Order Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ord : ${ordersPage.content}">
                                    <td class="font-monospace fw-bold text-dark" th:text="${ord.orderNumber}">ORD-12345</td>
                                    <td>
                                        <div class="fw-bold text-dark" th:text="${ord.user.name}">Customer Name</div>
                                        <small class="text-muted" th:text="${ord.user.email}">customer@example.com</small>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${#lists.size(ord.items)} + ' items'">2 items</span>
                                    </td>
                                    <td class="small" th:text="${#temporals.format(ord.createdAt, 'dd MMM yyyy, hh:mm a')}">07 Oct 2026</td>
                                    <td>
                                        <div class="fw-bold text-dark" th:text="'₹' + ${#numbers.formatDecimal(ord.netAmount, 0, 'COMMA', 0, 'POINT')}">₹49,999</div>
                                        <small class="text-muted" th:text="${ord.paymentMethod.name()}">COD</small>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${ord.paymentStatus.name() == 'PAID'} ? 'bg-success' : 'bg-warning text-dark'"
                                              th:text="${ord.paymentStatus}">PAID</span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${ord.orderStatus.name() == 'DELIVERED'} ? 'bg-success' : (${ord.orderStatus.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-primary')"
                                              th:text="${ord.orderStatus.displayName}">Placed</span>
                                    </td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/orders/{id}(id=${ord.id})}" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
                                            <i class="bi bi-gear-fill me-1"></i> Manage
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:replace="~{fragments/pagination :: pagination(${ordersPage}, '/admin/orders')}"></div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
