<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Manage Order ' + ${order.orderNumber} + ' — Admin'">Admin Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-lg-2 col-md-3">
                <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('orders')}"></div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-10 col-md-9 p-4">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">
                            Order <span class="font-monospace text-primary" th:text="${order.orderNumber}">ORD-12345</span>
                        </h3>
                        <small class="text-muted">Customer: <strong th:text="${order.user.name}">Rahul Sharma</strong> (<span th:text="${order.user.email}">user@example.com</span>)</small>
                    </div>
                    <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Back to Orders
                    </a>
                </div>

                <div class="row g-4">
                    <!-- Left: Status Workflow Controllers -->
                    <div class="col-lg-8">
                        
                        <!-- Status Update Actions Card -->
                        <div class="card border-0 shadow-sm rounded-3 p-4 mb-4">
                            <h5 class="fw-bold border-bottom pb-3 mb-3"><i class="bi bi-sliders text-primary me-2"></i>Order Fulfillment Controls</h5>
                            
                            <div class="row g-3">
                                <!-- Change Order Status -->
                                <div class="col-md-6">
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="POST" class="p-3 bg-light rounded-3">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Update Order Status</label>
                                        <div class="input-group">
                                            <select name="status" class="form-select form-select-sm">
                                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}"
                                                        th:selected="${order.orderStatus == st}">Status</option>
                                            </select>
                                            <button type="submit" class="btn btn-primary btn-sm fw-bold">Update</button>
                                        </div>
                                        <small class="text-muted mt-1 d-block">Current: <span class="badge bg-primary" th:text="${order.orderStatus.displayName}">Placed</span></small>
                                    </form>
                                </div>

                                <!-- Change Payment Status -->
                                <div class="col-md-6">
                                    <form th:action="@{/admin/orders/{id}/payment-status(id=${order.id})}" method="POST" class="p-3 bg-light rounded-3">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Update Payment Status</label>
                                        <div class="input-group">
                                            <select name="paymentStatus" class="form-select form-select-sm">
                                                <option th:each="pst : ${paymentStatuses}" th:value="${pst}" th:text="${pst.name()}"
                                                        th:selected="${order.paymentStatus == pst}">Payment Status</option>
                                            </select>
                                            <button type="submit" class="btn btn-success btn-sm fw-bold">Update</button>
                                        </div>
                                        <small class="text-muted mt-1 d-block">Current: <span class="badge bg-success" th:text="${order.paymentStatus}">PAID</span></small>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Items Snapshot Table -->
                        <div class="card border-0 shadow-sm rounded-3 p-4">
                            <h5 class="fw-bold border-bottom pb-3 mb-3">Order Items Snapshot</h5>
                            <div class="d-flex flex-column gap-3">
                                <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded-3" th:each="item : ${order.items}">
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:src="${item.productImageUrl != null ? item.productImageUrl : '/images/products/placeholder.svg'}"
                                             th:alt="${item.productName}" class="rounded bg-white p-1" style="width: 60px; height: 60px; object-fit: contain;">
                                        <div>
                                            <h6 class="fw-bold text-dark mb-0" th:text="${item.productName}">Product Name</h6>
                                            <small class="text-muted font-monospace" th:text="'SKU: ' + ${item.productSku}">SKU</small>
                                            <div class="small text-muted" th:text="'Qty: ' + ${item.quantity} + ' × ₹' + ${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')}">Qty</div>
                                        </div>
                                    </div>
                                    <div class="fw-bold fs-6 text-dark" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}">₹49,999</div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Right: Customer Info & Timeline -->
                    <div class="col-lg-4">
                        <!-- Shipping Address -->
                        <div class="card border-0 shadow-sm rounded-3 p-4 mb-4">
                            <h6 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-geo-alt-fill text-success me-2"></i>Shipping Address</h6>
                            <p class="text-secondary small mb-0" style="line-height: 1.6;" th:text="${order.shippingAddressSnapshot}">
                                Rahul Sharma, Bengaluru...
                            </p>
                            <div class="mt-3 pt-2 border-top small" th:if="${order.notes != null and !order.notes.isBlank()}">
                                <strong>Customer Notes:</strong>
                                <p class="text-muted mb-0" th:text="${order.notes}">Special notes...</p>
                            </div>
                        </div>

                        <!-- Tracking Preview -->
                        <div class="card border-0 shadow-sm rounded-3 p-4">
                            <h6 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-clock-history text-primary me-2"></i>Lifecycle Timeline</h6>
                            <div class="timeline-container py-1">
                                <div class="timeline-step" th:each="step, iterStat : ${timeline}"
                                     th:classappend="${step.completed ? 'completed' : ''} + ' ' + (${step.current ? 'current' : ''}) + ' ' + (${step.status.name() == 'CANCELLED' ? 'cancelled' : ''})">
                                    <div class="timeline-icon">
                                        <i class="bi bi-check-lg" th:if="${step.completed and !step.current and step.status.name() != 'CANCELLED'}"></i>
                                        <i class="bi bi-circle-fill" th:if="${step.current and step.status.name() != 'CANCELLED'}" style="font-size: 0.5rem;"></i>
                                        <i class="bi bi-x-lg" th:if="${step.status.name() == 'CANCELLED'}"></i>
                                        <span th:if="${!step.completed and step.status.name() != 'CANCELLED'}" th:text="${iterStat.count}">1</span>
                                    </div>
                                    <div>
                                        <div class="fw-bold small" th:text="${step.title}">Placed</div>
                                        <small class="text-muted d-block" th:if="${step.timestamp != null}"
                                               th:text="${#temporals.format(step.timestamp, 'dd MMM, hh:mm a')}">01 Oct</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
