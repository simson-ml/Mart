<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products — ShopSphere Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="py-4">
        <div class="container">

            <!-- Breadcrumb & Header Title -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Products</li>
                    <li class="breadcrumb-item active" th:if="${selectedCategory}" th:text="${selectedCategory}">Category</li>
                </ol>
            </nav>

            <div class="row g-4">
                <!-- Sidebar Filters -->
                <div class="col-lg-3">
                    <div class="card border-0 shadow-sm rounded-3 p-3 sticky-top" style="top: 80px; z-index: 10;">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0"><i class="bi bi-funnel-fill text-primary me-2"></i>Filters</h5>
                            <a th:href="@{/products}" class="text-danger small text-decoration-none fw-semibold">Reset All</a>
                        </div>

                        <form th:action="@{/products}" method="GET" id="filterForm">
                            <!-- Keyword Preserve -->
                            <input type="hidden" name="keyword" th:value="${selectedKeyword}">

                            <!-- Category Filter -->
                            <div class="mb-3 border-bottom pb-3">
                                <label class="form-label fw-bold small text-uppercase text-muted">Category</label>
                                <select name="category" class="form-select form-select-sm" onchange="document.getElementById('filterForm').submit();">
                                    <option value="">All Categories</option>
                                    <option th:each="cat : ${allCategories}"
                                            th:value="${cat.slug}"
                                            th:text="${cat.name}"
                                            th:selected="${selectedCategory == cat.slug}">Electronics</option>
                                </select>
                            </div>

                            <!-- Brand Filter -->
                            <div class="mb-3 border-bottom pb-3">
                                <label class="form-label fw-bold small text-uppercase text-muted">Brand</label>
                                <select name="brand" class="form-select form-select-sm" onchange="document.getElementById('filterForm').submit();">
                                    <option value="">All Brands</option>
                                    <option th:each="b : ${brands}"
                                            th:value="${b}"
                                            th:text="${b}"
                                            th:selected="${selectedBrand == b}">Brand</option>
                                </select>
                            </div>

                            <!-- Price Range Filter -->
                            <div class="mb-3 border-bottom pb-3">
                                <label class="form-label fw-bold small text-uppercase text-muted">Price Range (₹)</label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <input type="number" name="minPrice" class="form-control form-control-sm"
                                               placeholder="Min ₹" th:value="${selectedMinPrice}">
                                    </div>
                                    <div class="col-6">
                                        <input type="number" name="maxPrice" class="form-control form-control-sm"
                                               placeholder="Max ₹" th:value="${selectedMaxPrice}">
                                    </div>
                                </div>
                            </div>

                            <!-- Rating Filter -->
                            <div class="mb-3 border-bottom pb-3">
                                <label class="form-label fw-bold small text-uppercase text-muted">Customer Rating</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="minRating" id="rating4" value="4.0"
                                           th:checked="${selectedMinRating != null and selectedMinRating.doubleValue() == 4.0}">
                                    <label class="form-check-label small" for="rating4">
                                        <span class="text-warning">★★★★☆</span> 4.0 & above
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="minRating" id="rating3" value="3.0"
                                           th:checked="${selectedMinRating != null and selectedMinRating.doubleValue() == 3.0}">
                                    <label class="form-check-label small" for="rating3">
                                        <span class="text-warning">★★★☆☆</span> 3.0 & above
                                    </label>
                                </div>
                            </div>

                            <!-- Discount Filter -->
                            <div class="mb-3 border-bottom pb-3">
                                <label class="form-label fw-bold small text-uppercase text-muted">Discount</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="minDiscount" id="disc10" value="10"
                                           th:checked="${selectedMinDiscount != null and selectedMinDiscount.doubleValue() == 10.0}">
                                    <label class="form-check-label small" for="disc10">10% or more</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="minDiscount" id="disc20" value="20"
                                           th:checked="${selectedMinDiscount != null and selectedMinDiscount.doubleValue() == 20.0}">
                                    <label class="form-check-label small" for="disc20">20% or more</label>
                                </div>
                            </div>

                            <!-- Availability Filter -->
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="inStockOnly" id="inStockOnly" value="true"
                                           th:checked="${selectedInStockOnly}">
                                    <label class="form-check-label small fw-semibold" for="inStockOnly">
                                        Exclude Out of Stock
                                    </label>
                                </div>
                            </div>

                            <!-- Apply Button -->
                            <button type="submit" class="btn btn-primary w-100 btn-sm fw-bold">
                                <i class="bi bi-check2 me-1"></i> Apply Filters
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Products Grid Content -->
                <div class="col-lg-9">
                    <!-- Top Results Bar & Sorting -->
                    <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                            <div>
                                <span class="fw-bold fs-5 text-dark" th:text="${productsPage.totalElements}">35</span>
                                <span class="text-muted">products found</span>
                                <span th:if="${selectedKeyword}" class="badge bg-light text-dark border ms-2" th:text="'Keyword: ' + ${selectedKeyword}">Keyword</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <label class="small text-muted text-nowrap fw-semibold">Sort By:</label>
                                <select name="sortBy" class="form-select form-select-sm" style="width: auto;"
                                        onchange="location = this.value;">
                                    <option th:value="@{/products(keyword=${selectedKeyword},category=${selectedCategory},brand=${selectedBrand},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},minRating=${selectedMinRating},inStockOnly=${selectedInStockOnly},minDiscount=${selectedMinDiscount},sortBy='newest')}"
                                            th:selected="${selectedSortBy == 'newest'}">Newest Arrivals</option>
                                    <option th:value="@{/products(keyword=${selectedKeyword},category=${selectedCategory},brand=${selectedBrand},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},minRating=${selectedMinRating},inStockOnly=${selectedInStockOnly},minDiscount=${selectedMinDiscount},sortBy='price_asc')}"
                                            th:selected="${selectedSortBy == 'price_asc'}">Price: Low to High</option>
                                    <option th:value="@{/products(keyword=${selectedKeyword},category=${selectedCategory},brand=${selectedBrand},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},minRating=${selectedMinRating},inStockOnly=${selectedInStockOnly},minDiscount=${selectedMinDiscount},sortBy='price_desc')}"
                                            th:selected="${selectedSortBy == 'price_desc'}">Price: High to Low</option>
                                    <option th:value="@{/products(keyword=${selectedKeyword},category=${selectedCategory},brand=${selectedBrand},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},minRating=${selectedMinRating},inStockOnly=${selectedInStockOnly},minDiscount=${selectedMinDiscount},sortBy='rating')}"
                                            th:selected="${selectedSortBy == 'rating'}">Customer Rating</option>
                                    <option th:value="@{/products(keyword=${selectedKeyword},category=${selectedCategory},brand=${selectedBrand},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},minRating=${selectedMinRating},inStockOnly=${selectedInStockOnly},minDiscount=${selectedMinDiscount},sortBy='popular')}"
                                            th:selected="${selectedSortBy == 'popular'}">Most Popular</option>
                                    <option th:value="@{/products(keyword=${selectedKeyword},category=${selectedCategory},brand=${selectedBrand},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},minRating=${selectedMinRating},inStockOnly=${selectedInStockOnly},minDiscount=${selectedMinDiscount},sortBy='discount')}"
                                            th:selected="${selectedSortBy == 'discount'}">Biggest Discount</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div th:if="${productsPage.empty}" class="card border-0 shadow-sm rounded-3 text-center py-5">
                        <div class="card-body">
                            <i class="bi bi-search text-muted display-3 mb-3"></i>
                            <h4 class="fw-bold">No Products Found</h4>
                            <p class="text-muted">We couldn't find any products matching your selected search or filter criteria.</p>
                            <a th:href="@{/products}" class="btn btn-primary rounded-pill px-4">
                                <i class="bi bi-arrow-clockwise me-1"></i> Clear All Filters
                            </a>
                        </div>
                    </div>

                    <!-- Products Grid -->
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" th:if="${!productsPage.empty}">
                        <div class="col" th:each="prod : ${productsPage.content}">
                            <div class="product-card shadow-sm">
                                <div class="product-image-wrap">
                                    <span class="discount-badge" th:if="${prod.discountPercentage > 0}"
                                          th:text="${#numbers.formatDecimal(prod.discountPercentage, 0, 0)} + '% OFF'">15% OFF</span>
                                    <button type="button" class="wishlist-btn-corner ajax-wishlist-btn"
                                            th:attr="data-product-id=${prod.id}" title="Add to Wishlist">
                                        <i class="bi bi-heart"></i>
                                    </button>
                                    <a th:href="@{/products/{slug}(slug=${prod.slug})}">
                                        <img th:src="${prod.imageUrl != null ? prod.imageUrl : '/images/products/placeholder.svg'}"
                                             th:alt="${prod.name}"
                                             onerror="this.onerror=null; this.src='/images/products/placeholder.svg';"
                                             loading="lazy">
                                    </a>
                                </div>
                                <div class="product-body">
                                    <div class="product-brand" th:text="${prod.brand}">Brand</div>
                                    <a th:href="@{/products/{slug}(slug=${prod.slug})}" class="product-title" th:text="${prod.name}">Product Name</a>
                                    <div class="d-flex align-items-center mb-2">
                                        <span class="rating-badge"><i class="bi bi-star-fill"></i> <span th:text="${prod.rating}">4.5</span></span>
                                        <span class="rating-count" th:text="'(' + ${prod.reviewCount} + ')'">(120)</span>
                                    </div>
                                    <div class="price-box">
                                        <div class="d-flex align-items-baseline">
                                            <span class="current-price" th:text="'₹' + ${#numbers.formatDecimal(prod.getDiscountedPrice(), 0, 'COMMA', 0, 'POINT')}">₹49,999</span>
                                            <span class="original-price" th:if="${prod.discountPercentage > 0}"
                                                  th:text="'₹' + ${#numbers.formatDecimal(prod.price, 0, 'COMMA', 0, 'POINT')}">₹59,999</span>
                                        </div>
                                        <div class="small text-success mt-1 fw-semibold" th:if="${!prod.isOutOfStock()}">
                                            <i class="bi bi-check-circle-fill"></i> In Stock
                                            <span class="text-danger" th:if="${prod.isLowStock()}" th:text="'(Only ' + ${prod.stockQuantity} + ' left!)'"></span>
                                        </div>
                                        <div class="small text-danger mt-1 fw-semibold" th:if="${prod.isOutOfStock()}">
                                            <i class="bi bi-x-circle-fill"></i> Out of Stock
                                        </div>

                                        <form action="/cart/add" method="POST" class="mt-3 ajax-cart-form">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                                            <input type="hidden" name="productId" th:value="${prod.id}">
                                            <input type="hidden" name="quantity" value="1">
                                            <button type="submit" class="btn btn-outline-primary w-100 btn-sm fw-semibold rounded-pill"
                                                    th:disabled="${prod.isOutOfStock()}">
                                                <i class="bi bi-cart-plus me-1"></i> <span th:text="${prod.isOutOfStock() ? 'Out of Stock' : 'Add to Cart'}">Add to Cart</span>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div th:replace="~{fragments/pagination :: pagination(${productsPage}, '/products')}"></div>

                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
