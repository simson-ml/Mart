<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="py-4">
        <div class="container">

            <h3 class="fw-bold mb-4"><i class="bi bi-box-seam-fill text-primary me-2"></i>My Orders (<span th:text="${ordersPage.totalElements}">2</span>)</h3>

            <!-- Empty State -->
            <div th:if="${ordersPage.empty}" class="card border-0 shadow-sm rounded-3 text-center py-5">
                <div class="card-body">
                    <i class="bi bi-box-seam text-muted display-1 mb-3"></i>
                    <h4 class="fw-bold">No Orders Yet</h4>
                    <p class="text-muted mb-4">You haven't placed any orders with ShopSphere yet.</p>
                    <a th:href="@{/products}" class="btn btn-primary btn-lg rounded-pill px-5 fw-semibold shadow-sm">
                        <i class="bi bi-bag-plus me-1"></i> Start Shopping
                    </a>
                </div>
            </div>

            <!-- Orders List -->
            <div class="d-flex flex-column gap-4" th:if="${!ordersPage.empty}">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden" th:each="order : ${ordersPage.content}">
                    <!-- Order Header -->
                    <div class="card-header bg-light py-3 border-0">
                        <div class="row align-items-center g-3">
                            <div class="col-sm-3 col-6">
                                <small class="text-muted d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Order Placed</small>
                                <span class="fw-bold text-dark" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">01 Oct 2026</span>
                            </div>
                            <div class="col-sm-3 col-6">
                                <small class="text-muted d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Total Amount</small>
                                <span class="fw-bold text-primary" th:text="'₹' + ${#numbers.formatDecimal(order.netAmount, 0, 'COMMA', 0, 'POINT')}">₹23,992</span>
                            </div>
                            <div class="col-sm-3 col-6">
                                <small class="text-muted d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Status</small>
                                <span class="badge"
                                      th:classappend="${order.orderStatus.name() == 'DELIVERED'} ? 'bg-success' : (${order.orderStatus.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-primary')"
                                      th:text="${order.orderStatus.displayName}">Delivered</span>
                            </div>
                            <div class="col-sm-3 col-6 text-sm-end">
                                <small class="text-muted d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Order Number</small>
                                <span class="font-monospace fw-bold text-secondary" th:text="${order.orderNumber}">ORD-20261001-9812</span>
                            </div>
                        </div>
                    </div>

                    <!-- Order Items Body -->
                    <div class="card-body p-4">
                        <div class="d-flex flex-column gap-3">
                            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3"
                                 th:each="item : ${order.items}">
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="${item.productImageUrl != null ? item.productImageUrl : '/images/products/placeholder.svg'}"
                                         th:alt="${item.productName}"
                                         onerror="this.onerror=null; this.src='/images/products/placeholder.svg';"
                                         class="rounded bg-light p-1" style="width: 70px; height: 70px; object-fit: contain;">
                                    <div>
                                        <h6 class="fw-bold text-dark mb-1" th:text="${item.productName}">Product Name</h6>
                                        <small class="text-muted" th:text="'Qty: ' + ${item.quantity} + ' • ₹' + ${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' each'">Qty: 1 • ₹23,992</small>
                                    </div>
                                </div>
                                <div class="d-flex gap-2 w-100 w-sm-auto justify-content-sm-end">
                                    <a th:href="@{/orders/{orderNumber}(orderNumber=${order.orderNumber})}" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
                                        <i class="bi bi-eye-fill me-1"></i> View Order
                                    </a>
                                    <a th:href="@{/orders/{orderNumber}/track(orderNumber=${order.orderNumber})}" class="btn btn-primary btn-sm rounded-pill px-3 fw-semibold">
                                        <i class="bi bi-geo-alt me-1"></i> Track Order
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:replace="~{fragments/pagination :: pagination(${ordersPage}, '/orders')}"></div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
