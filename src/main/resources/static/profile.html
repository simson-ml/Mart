<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShopSphere | My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <div class="container page-head">
      <div class="breadcrumbs">
        <a href="/home.html">Home</a> / <span>My account</span>
      </div>
      <h1>My account</h1>
    </div>

    <div class="container" style="padding-bottom: 80px">
      <div class="dash-shell">
        <nav class="dash-sidebar" id="dashNav">
          <a href="#profile" class="active" data-tab="profile">Profile</a>
          <a href="#security" data-tab="security">Security</a>
          <a href="#addresses" data-tab="addresses">Addresses</a>
          <a href="/orders.html">Order history</a>
        </nav>

        <div id="dashContent">
          <div class="skeleton" style="height: 320px"></div>
        </div>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="/assets/js/app.js"></script>
    <script>
      SS.renderHeader("profile");
      SS.renderFooter();

      const content = document.getElementById("dashContent");
      let user = null;

      function tabProfile() {
        return `
    <div class="card profile-card">
      <div class="avatar-lg">${SS.escapeHtml((user.name || "?").charAt(0).toUpperCase())}</div>
      <div>
        <h3>${SS.escapeHtml(user.name)}</h3>
        <p class="text-muted" style="font-size:var(--fs-sm)">${SS.escapeHtml(user.email)}</p>
        <span class="badge badge-primary u-mt-2">${SS.escapeHtml(user.role)}</span>
      </div>
    </div>
    <div class="card u-mt-6" style="padding:var(--sp-6);max-width:480px">
      <h3>Personal information</h3>
      <form id="profileForm" class="u-mt-4">
        <div class="field"><label for="pName">Full name</label><input class="input" id="pName" value="${SS.escapeHtml(user.name)}"></div>
        <div class="field"><label for="pEmail">Email address</label><input class="input" id="pEmail" value="${SS.escapeHtml(user.email)}" disabled></div>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </div>`;
      }

      function tabSecurity() {
        return `
    <div class="card" style="padding:var(--sp-6);max-width:480px">
      <h3>Change password</h3>
      <p class="text-muted u-mt-2" style="font-size:var(--fs-sm)">Choose a strong password you don't use elsewhere.</p>
      <form id="pwdForm" class="u-mt-4">
        <div class="field"><label for="oldPwd">Current password</label><input class="input" id="oldPwd" type="password" required></div>
        <div class="field"><label for="newPwd">New password</label><input class="input" id="newPwd" type="password" minlength="6" required></div>
        <button class="btn btn-primary" type="submit">Update password</button>
      </form>
    </div>`;
      }

      function addressCard(a) {
        return `
    <div class="card" style="padding:var(--sp-5)" data-addr-id="${a.id}">
      <div class="u-flex u-justify-between u-items-center">
        <b>${SS.escapeHtml(a.name || "Address")}</b>
        ${a.defaultAddress ? `<span class="badge badge-primary">Default</span>` : ""}
      </div>
      <p class="text-muted u-mt-2" style="font-size:var(--fs-sm)">
        ${SS.escapeHtml(a.address || "")}<br>${SS.escapeHtml([a.city, a.state, a.pincode].filter(Boolean).join(", "))}<br>${SS.escapeHtml(a.phone || "")}
      </p>
      <button class="btn btn-danger btn-sm u-mt-4" data-remove-addr="${a.id}">Remove</button>
    </div>`;
      }

      async function tabAddresses() {
        content.innerHTML = `<div class="skeleton" style="height:200px"></div>`;
        let addresses = [];
        try {
          addresses = await SS.api("/api/addresses");
        } catch (e) {}
        content.innerHTML = `
    <div class="section-head" style="margin-bottom:20px"><div><h3>Saved addresses</h3></div></div>
    <div class="value-grid" id="addrGrid">
      ${addresses.map(addressCard).join("") || `<p class="text-muted">No saved addresses yet.</p>`}
    </div>
    <div class="card u-mt-6" style="padding:var(--sp-6);max-width:480px">
      <h3>Add a new address</h3>
      <form id="addrForm" class="u-mt-4">
        <div class="field"><label for="aName">Label / recipient name</label><input class="input" id="aName" required></div>
        <div class="field"><label for="aPhone">Phone</label><input class="input" id="aPhone"></div>
        <div class="field"><label for="aAddress">Address</label><textarea class="input" id="aAddress" rows="2"></textarea></div>
        <div class="u-flex u-gap-3">
          <div class="field" style="flex:1"><label for="aCity">City</label><input class="input" id="aCity"></div>
          <div class="field" style="flex:1"><label for="aState">State</label><input class="input" id="aState"></div>
          <div class="field" style="flex:1"><label for="aPincode">Pincode</label><input class="input" id="aPincode"></div>
        </div>
        <label class="checkbox-row"><input type="checkbox" id="aDefault"> Set as default address</label>
        <button class="btn btn-primary u-mt-4" type="submit">Save address</button>
      </form>
    </div>`;

        document
          .getElementById("addrGrid")
          .addEventListener("click", async (e) => {
            const btn = e.target.closest("[data-remove-addr]");
            if (!btn) return;
            const ok = await SS.confirmDialog({
              title: "Remove address?",
              confirmLabel: "Remove",
              danger: true,
            });
            if (!ok) return;
            try {
              await SS.api("/api/addresses/" + btn.dataset.removeAddr, {
                method: "DELETE",
              });
              SS.toast("Address removed", "info");
              tabAddresses();
            } catch (err) {
              SS.toast(err.message, "error");
            }
          });

        document
          .getElementById("addrForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
              await SS.api("/api/addresses", {
                method: "POST",
                body: {
                  name: document.getElementById("aName").value.trim(),
                  phone: document.getElementById("aPhone").value.trim(),
                  address: document.getElementById("aAddress").value.trim(),
                  city: document.getElementById("aCity").value.trim(),
                  state: document.getElementById("aState").value.trim(),
                  pincode: document.getElementById("aPincode").value.trim(),
                  defaultAddress: document.getElementById("aDefault").checked,
                },
              });
              SS.toast("Address saved", "success");
              tabAddresses();
            } catch (err) {
              SS.toast(err.message, "error");
            }
          });
      }

      function setActiveTab(tab) {
        document
          .querySelectorAll("#dashNav [data-tab]")
          .forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
      }

      async function showTab(tab) {
        setActiveTab(tab);
        if (tab === "profile") {
          content.innerHTML = tabProfile();
          document
            .getElementById("profileForm")
            .addEventListener("submit", async (e) => {
              e.preventDefault();
              try {
                const d = await SS.api("/api/auth/profile", {
                  method: "PUT",
                  body: { name: document.getElementById("pName").value.trim() },
                });
                user = d.user;
                SS.toast("Profile updated", "success");
                showTab("profile");
              } catch (err) {
                SS.toast(err.message, "error");
              }
            });
        } else if (tab === "security") {
          content.innerHTML = tabSecurity();
          document
            .getElementById("pwdForm")
            .addEventListener("submit", async (e) => {
              e.preventDefault();
              try {
                await SS.api("/api/auth/change-password", {
                  method: "POST",
                  body: {
                    oldPassword: document.getElementById("oldPwd").value,
                    newPassword: document.getElementById("newPwd").value,
                  },
                });
                SS.toast("Password updated", "success");
                e.target.reset();
              } catch (err) {
                SS.toast(err.message, "error");
              }
            });
        } else if (tab === "addresses") {
          await tabAddresses();
        }
      }

      document.getElementById("dashNav").addEventListener("click", (e) => {
        const a = e.target.closest("[data-tab]");
        if (!a) return;
        e.preventDefault();
        showTab(a.dataset.tab);
      });

      (async function init() {
        user = await SS.requireAuth("/profile.html");
        if (!user) return;
        showTab("profile");
      })();
    </script>
  </body>
</html>
