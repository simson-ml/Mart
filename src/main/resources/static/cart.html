<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShopSphere | Your Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <div class="container page-head">
      <div class="breadcrumbs">
        <a href="/home.html">Home</a> / <span>Cart</span>
      </div>
      <h1>Your cart</h1>
    </div>

    <div class="container" style="padding-bottom: 80px">
      <div id="cartRoot">
        <div class="cart-layout">
          <div class="skeleton" style="height: 280px"></div>
          <div class="skeleton" style="height: 220px"></div>
        </div>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="/assets/js/app.js"></script>
    <script>
      SS.renderHeader("shop");
      SS.renderFooter();

      const root = document.getElementById("cartRoot");

      function lineHtml(item) {
        const p = item.product;
        const img = p.imageUrl
          ? `<img src="${SS.escapeHtml(p.imageUrl)}" alt="${SS.escapeHtml(p.name)}" onerror="this.parentElement.textContent='🛍️'">`
          : "🛍️";
        return `
    <div class="line-row" data-line-id="${item.id}">
      <a href="/product.html?id=${p.id}" class="line-media">${img}</a>
      <div>
        <a href="/product.html?id=${p.id}"><div class="line-title">${SS.escapeHtml(p.name)}</div></a>
        <div class="line-meta">${SS.money(p.price)} each · ${p.stock} in stock</div>
      </div>
      <div class="qty-stepper">
        <button type="button" data-qty-minus>−</button>
        <span data-qty-value>${item.quantity}</span>
        <button type="button" data-qty-plus>+</button>
      </div>
      <div class="line-price">${SS.money(p.price * item.quantity)}</div>
      <button class="line-remove" data-remove aria-label="Remove item">${SS.ICON.trash}</button>
    </div>`;
      }

      function renderSummary(items) {
        const subtotal = items.reduce(
          (s, i) => s + i.product.price * i.quantity,
          0,
        );
        const shipping = items.length ? (subtotal > 999 ? 0 : 49) : 0;
        const total = subtotal + shipping;
        return `
    <div class="card summary-card" style="padding:var(--sp-6)">
      <h3>Order summary</h3>
      <div class="summary-row"><span>Subtotal</span><span>${SS.money(subtotal)}</span></div>
      <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "Free" : SS.money(shipping)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${SS.money(total)}</span></div>
      <div class="field u-mt-4">
        <label for="shipAddress">Shipping address</label>
        <textarea class="input" id="shipAddress" rows="2" placeholder="Enter your delivery address"></textarea>
      </div>
      <button class="btn btn-primary btn-block u-mt-2" id="checkoutBtn" ${items.length ? "" : "disabled"}>Checkout</button>
      <p class="helper-text u-mt-2" style="text-align:center">Payments are simulated for this demo.</p>
    </div>`;
      }

      async function load() {
        const user = await SS.requireAuth("/cart.html");
        if (!user) return;
        try {
          const items = await SS.api("/api/cart");
          if (!items.length) {
            root.innerHTML = `<div class="empty-state">
        <div class="ic">🛒</div><h3>Your cart is empty</h3><p>Looks like you haven't added anything yet.</p>
        <a href="/home.html#shop" class="btn btn-primary">Start shopping</a>
      </div>`;
            return;
          }
          root.innerHTML = `
      <div class="cart-layout">
        <div class="card" style="padding:var(--sp-5) var(--sp-6)" id="lineList">
          ${items.map(lineHtml).join("")}
        </div>
        <div id="summaryWrap">${renderSummary(items)}</div>
      </div>`;
          wire(items);
        } catch (e) {
          root.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div><h3>Couldn't load your cart</h3><p>${SS.escapeHtml(e.message)}</p></div>`;
        }
      }

      function wire(items) {
        const lineList = document.getElementById("lineList");

        async function updateQty(id, newQty) {
          if (newQty < 1) return;
          try {
            await SS.api("/api/cart/" + id + "?quantity=" + newQty, {
              method: "PUT",
            });
            load();
          } catch (e) {
            SS.toast(e.message, "error");
          }
        }

        lineList.addEventListener("click", async (e) => {
          const row = e.target.closest("[data-line-id]");
          if (!row) return;
          const id = row.dataset.lineId;
          const item = items.find((i) => String(i.id) === id);
          if (e.target.closest("[data-qty-plus]"))
            updateQty(id, item.quantity + 1);
          if (e.target.closest("[data-qty-minus]")) {
            if (item.quantity <= 1) return removeItem(id);
            updateQty(id, item.quantity - 1);
          }
          if (e.target.closest("[data-remove]")) removeItem(id);
        });

        async function removeItem(id) {
          const ok = await SS.confirmDialog({
            title: "Remove item?",
            body: "This item will be removed from your cart.",
            confirmLabel: "Remove",
            danger: true,
          });
          if (!ok) return;
          try {
            await SS.api("/api/cart/" + id, { method: "DELETE" });
            SS.toast("Item removed", "info");
            load();
          } catch (e) {
            SS.toast(e.message, "error");
          }
        }

        document
          .getElementById("checkoutBtn")
          .addEventListener("click", async (e) => {
            const btn = e.currentTarget;
            const address = document.getElementById("shipAddress").value.trim();
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Placing order…';
            try {
              const order = await SS.api("/api/orders", {
                method: "POST",
                body: { address },
              });
              SS.toast("Order placed!", "success");
              window.location.href = "/orders.html?placed=" + order.id;
            } catch (e) {
              SS.toast(e.message, "error");
              btn.disabled = false;
              btn.textContent = "Checkout";
            }
          });
      }

      load();
    </script>
  </body>
</html>
