<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShopSphere | Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-visual">
        <a href="/home.html" class="brand" style="font-size: 1.35rem"
          ><span>🛍️</span> Shop<span
            class="dot"
            style="color: var(--color-primary)"
            >Sphere</span
          ></a
        >
        <div>
          <blockquote>
            “Everything I need, beautifully laid out and always one tap away.”
          </blockquote>
          <cite>— A ShopSphere shopper</cite>
        </div>
        <div
          class="u-flex u-gap-3"
          style="opacity: 0.7; font-size: var(--fs-xs)"
        >
          <span>Curated catalog</span>&middot;<span>Fast checkout</span
          >&middot;<span>Order tracking</span>
        </div>
      </aside>

      <div class="auth-form-side">
        <div class="auth-box">
          <div class="logo">Shop<span>Sphere</span></div>
          <h1>Welcome back</h1>
          <p class="sub">Sign in to continue to your account.</p>

          <form id="f" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <input
                class="input"
                id="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="input-group">
                <input
                  class="input"
                  id="password"
                  type="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="input-toggle"
                  type="button"
                  id="togglePwd"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
            </div>
            <button
              class="btn btn-primary btn-block"
              id="submitBtn"
              type="submit"
            >
              Sign in
            </button>
          </form>
          <p class="form-msg" id="msg" aria-live="polite"></p>
          <p class="auth-footer-link">
            Don't have an account? <a href="/signup.html">Create one</a>
          </p>
        </div>
      </div>
    </div>

    <script src="/assets/js/app.js"></script>
    <script>
      const f = document.getElementById("f");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const msg = document.getElementById("msg");
      const submitBtn = document.getElementById("submitBtn");

      document.getElementById("togglePwd").addEventListener("click", () => {
        password.type = password.type === "password" ? "text" : "password";
      });

      f.onsubmit = async (e) => {
        e.preventDefault();
        msg.className = "form-msg";
        msg.textContent = "";
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Signing in…';
        try {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: email.value,
              password: password.value,
            }),
          });
          const d = await r.json();
          if (!r.ok) {
            msg.classList.add("error");
            msg.textContent = d.message;
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign in";
            return;
          }
          msg.classList.add("success");
          msg.textContent = "Success! Redirecting…";
          const next = new URLSearchParams(location.search).get("next");
          location.href = next || "/home.html";
        } catch (x) {
          msg.classList.add("error");
          msg.textContent = "Unable to connect to server.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
        }
      };
    </script>
  </body>
</html>
