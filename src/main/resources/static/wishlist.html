<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShopSphere | Wishlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <div class="container page-head">
      <div class="breadcrumbs">
        <a href="/home.html">Home</a> / <span>Wishlist</span>
      </div>
      <h1>Your wishlist</h1>
    </div>

    <div class="container" style="padding-bottom: 80px">
      <div class="grid-products" id="wishlistGrid">
        <div class="skeleton skel-card"></div>
        <div class="skeleton skel-card"></div>
        <div class="skeleton skel-card"></div>
        <div class="skeleton skel-card"></div>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="/assets/js/app.js"></script>
    <script>
      SS.renderHeader("shop");
      SS.renderFooter();

      const grid = document.getElementById("wishlistGrid");
      SS.wireProductGrid(grid);

      grid.addEventListener("click", (e) => {
        const wishBtn = e.target.closest("[data-wishlist-btn]");
        if (wishBtn) {
          // wishlist page: clicking the heart removes it, then re-render
          setTimeout(load, 400);
        }
      });

      async function load() {
        const user = await SS.requireAuth("/wishlist.html");
        if (!user) return;
        try {
          const items = await SS.api("/api/wishlist");
          if (!items.length) {
            grid.innerHTML = "";
            grid.parentElement.insertAdjacentHTML(
              "beforeend",
              `<div class="empty-state" id="emptyWishlist">
        <div class="ic">💜</div><h3>Your wishlist is empty</h3><p>Save products you love and find them here later.</p>
        <a href="/home.html#shop" class="btn btn-primary">Discover products</a>
      </div>`,
            );
            return;
          }
          document.getElementById("emptyWishlist")?.remove();
          grid.innerHTML = items
            .map((i) => SS.productCardHtml(i.product, true))
            .join("");
        } catch (e) {
          grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="ic">⚠️</div><h3>Couldn't load your wishlist</h3><p>${SS.escapeHtml(e.message)}</p></div>`;
        }
      }

      load();
    </script>
  </body>
</html>
