# ==============================================================================
# SHOPSPHERE - APPLICATION CONFIGURATION
# ==============================================================================
spring.application.name=shopsphere

# Profile configuration (default: dev using H2)
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Default Admin Credentials (Override via environment variables)
app.admin.name=${ADMIN_NAME:ShopSphere Administrator}
app.admin.email=${ADMIN_EMAIL:admin@shopsphere.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# UPI Merchant Configuration
app.upi.merchant-id=${UPI_MERCHANT_ID:simson2610@nyes}
app.upi.merchant-name=${UPI_MERCHANT_NAME:ShopSphere Mart}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Thymeleaf Cache (disable for development)
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.root=INFO
logging.level.com.simson.shopsphere=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# AI Chatbot Configuration
ai.chatbot.provider=${CHATBOT_PROVIDER:mock}
ai.chatbot.gemini-api-key=${GEMINI_API_KEY:}
ai.chatbot.gemini-model=${GEMINI_MODEL:gemini-1.5-flash}
ai.chatbot.gemini-api-url=https://generativelanguage.googleapis.com/v1beta/models/
ai.chatbot.max-message-length=1000
ai.chatbot.timeout-seconds=10
ai.chatbot.rate-limit.max-requests=10
ai.chatbot.rate-limit.window-seconds=60
ai.chatbot.cache.enabled=true
ai.chatbot.cache.max-entries-per-session=50
ai.chatbot.cache.expire-minutes=30
